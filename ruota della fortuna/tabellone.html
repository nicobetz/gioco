<html>

	<style>
body {
  //overflow: hidden;
  font-family: Helvetica, sans serif;
  background: orange;
}
input {
  border-style: solid;
  border-width: 0px 0px 1px;
  border-color: #dcdcdc;
}
input:hover,
input:active,
input:focus {
  border-color: #454545;
}
input[disabled] {
  background: #cdcdcd;
  border-color: #dcdcdc;
}
h1 {
	text-align: center;
}
#pin {
  height: 0;
  width: 0;
  position: relative;
  left: 0px;
  margin-bottom: 0px;
  border: 20px solid;
  border-color: transparent transparent black;
  transform: rotate(180deg);
}
.container {
  position: relative;
  width: 90%;
  max-width: 400px;
}
.container .btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  -ms-transform: translate(-50%, -50%);
  background-color: grey;
  color: black;
  font-size: 10px;
  padding: 16px 30px;
  border: none;
  cursor: pointer;
  border-radius: 5px;
  text-align: center;
opacity: .6;
z-index: 8;
font-size: 2rem;
display: inline-block;
padding: 1rem;
}

#circle {
  width: 300px;
  height: 300px;
  background:
  url(ruotaa.png)
 
    center center;
  background-size: 300px 300px;
  transition: transform ease-in-out 10s;
  transform: rotate(0deg);
  border-radius: 100%;
  font-size: 150px;
  line-height: 100px;
  vertical-align: top;
  text-align: center;
  
 
}
#pls-click {
    position: absolute;
    text-align: center;
    line-height: 40%;
    z-index: 10;
    background: #000;
    opacity: .6;
    border-radius: 1rem;
    color: #fff;
    font-size: 2rem;
    top: 20%;
    left:30%;
    display: inline-block;
    padding: 1rem;
    transform: translateY(-50%) translateX(-50%);
    width: 10%;
    cursor: pointer;
    top:340px;
    background-attachment: initial;
}
#risposta {
  display: none;
}
.cella {
  display: inline-block;
  width: 40px;
  height: 40px;
  line-height: 40px;
  margin: 3px;
  background: black;
  font-size: 20px;
  text-align: center;
  vertical-align: middle;
}
.cella.lettera {
  background: green;
  color: white;
}
#lettera {
  width: 15px;
}

.punteggio {
  text-align: center;
  box-shadow: 1px 1px 5px #333;
}
table {
	position:relative;
	top:25%;
	right:40px;

.button1 {font-size: 16px;}
.button2 {font-size: 16px;}
.button3 {font-size: 16px;}
.button4 {font-size: 16px;}
.button5 {font-size: 16px;}
